<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>POE Profit Watch - Dashboard</title>
  <link rel="stylesheet" href="../../dist/dashboard/dashboard.css" />
  <style>
    :root { color-scheme: dark; }
    .backdrop-blur { backdrop-filter: blur(6px); }
    .modal-open { overflow: hidden; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-7xl mx-auto p-4 space-y-4">
    <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight">POE 2  Profit Watch</h1>
        <p class="text-slate-400">Record and track profitable crafts</p>
      </div>
      <div class="flex items-center gap-2 self-stretch sm:self-auto sm:ml-auto">
        <button
          id="openSettings"
          type="button"
          class="inline-flex items-center justify-center rounded-full bg-slate-800 p-1.5 text-slate-200 hover:bg-slate-700 border border-slate-700 shadow-sm"
          aria-label="Open settings"
        >
          <img src="../../public/setting.png" alt="Settings" class="h-5 w-5" style="filter: invert(1);" />
        </button>
      </div>
    </header>

    <section class="rounded-2xl border border-slate-800 bg-slate-900/70 p-4 backdrop-blur">
      <div class="mb-3">
        <h2 class="text-xl font-semibold text-slate-100">Profit Recipes</h2>
      </div>
      <div id="recipesGrid" class="grid gap-4" style="grid-template-columns: repeat(4, minmax(240px, 1fr)); min-height:200px;"></div>
      <div id="noRecipes" class="mt-4 text-center text-slate-400 hidden">No recipes yet. Click "Add Recipe" to create one.</div>
      <div class="mt-4 flex justify-end">
        <button id="addRecipe" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">Add Recipe</button>
      </div>
    </section>
  </div>

  <div id="recipeDetailsModal" class="fixed inset-0 z-45 hidden flex items-center justify-center bg-slate-950/80 p-4">
    <div class="w-full max-w-3xl max-h-[90vh] overflow-y-auto rounded-2xl border border-slate-700 bg-slate-900 p-5 shadow-xl">
      <div class="mb-4 flex items-start justify-between gap-4">
        <h3 id="recipeDetailsTitle" class="text-lg font-bold">Recipe Details</h3>
        <button id="closeRecipeDetails" class="rounded-md bg-slate-800 px-2 py-1 text-sm text-slate-200 hover:bg-slate-700">✕</button>
      </div>
      <div id="recipeDetailsContent" class="space-y-4 text-sm text-slate-200">
        <!-- Filled dynamically -->
      </div>
      <div class="mt-5 flex justify-end gap-2">
        <button id="editFromDetails" class="rounded-lg bg-violet-600 px-3 py-2 text-sm font-semibold text-white hover:bg-violet-500">Edit Recipe</button>
      </div>
    </div>
  </div>

  <div id="recipeModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-950/80 p-4">
    <div class="w-full max-w-3xl max-h-[90vh] overflow-y-auto rounded-2xl border border-slate-700 bg-slate-900 p-5 shadow-xl">
      <div class="mb-4 flex items-start justify-between gap-4">
        <h3 id="recipeModalTitle" class="text-lg font-bold">Add Recipe</h3>
        <button id="closeModal" class="rounded-md bg-slate-800 px-2 py-1 text-sm text-slate-200 hover:bg-slate-700">✕</button>
      </div>
      <div class="space-y-3">
        <label class="block">
          <span class="text-slate-300">Recipe Name</span>
          <input id="modalRecipeName" type="text" class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-slate-100" />
        </label>
        <label class="block">
          <span class="text-slate-300">Notification Profit Threshold</span>
          <input id="modalThreshold" type="number" step="0.01" value="0" class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-slate-100" />
        </label>

      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
        <div class="rounded-lg border border-slate-700 p-3">
          <div class="mb-2">
            <h4 class="text-sm font-semibold">Inputs</h4>
          </div>
          <div id="modalInputs" class="space-y-2"></div>
          <div class="mt-2 flex justify-end">
            <button id="addModalInput" class="rounded-md bg-indigo-600 px-2 py-1 text-xs text-white hover:bg-indigo-500">+</button>
          </div>
        </div>
        <div class="rounded-lg border border-slate-700 p-3">
          <div class="mb-2">
            <h4 class="text-sm font-semibold">Outputs</h4>
          </div>
          <div id="modalOutputs" class="space-y-2"></div>
          <div class="mt-2 flex justify-end">
            <button id="addModalOutput" class="rounded-md bg-indigo-600 px-2 py-1 text-xs text-white hover:bg-indigo-500">+</button>
          </div>
        </div>
      </div>

      <div class="mt-5 flex items-center justify-between gap-2">
        <div class="flex items-center gap-4">
          <div class="flex items-center gap-2">
            <span class="text-slate-300 text-sm">Enabled</span>
            <button id="modalIsEnabled" type="button" class="relative h-6 w-11 rounded-full bg-violet-600 transition-colors duration-200 focus:outline-none" aria-pressed="true" role="switch">
              <span class="absolute left-0.5 top-0.5 h-5 w-5 rounded-full bg-white shadow transition-transform duration-200 transform translate-x-5"></span>
            </button>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-slate-300 text-sm">Show notification</span>
            <button id="modalShowNotification" type="button" class="relative h-6 w-11 rounded-full bg-violet-600 transition-colors duration-200 focus:outline-none" aria-pressed="true" role="switch">
              <span class="absolute left-0.5 top-0.5 h-5 w-5 rounded-full bg-white shadow transition-transform duration-200 transform translate-x-5"></span>
            </button>
          </div>
        </div>
        <div class="flex justify-end gap-2">
          <button id="deleteModal" class="rounded-lg border border-slate-700 px-3 py-2 text-sm text-slate-200 hover:bg-slate-800" aria-label="Delete recipe">🗑</button>
          <button id="cancelModal" class="rounded-lg border border-slate-700 px-3 py-2 text-sm text-slate-200 hover:bg-slate-800">Cancel</button>
          <button id="saveModal" class="rounded-lg bg-violet-600 px-3 py-2 text-sm font-semibold text-white hover:bg-violet-500">Save Recipe</button>
        </div>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="fixed inset-0 z-40 hidden flex items-center justify-center bg-slate-950/80 p-4">
    <div class="w-full max-w-xl max-h-[90vh] overflow-y-auto rounded-2xl border border-slate-700 bg-slate-900 p-5 shadow-xl">
      <div class="mb-4 flex items-start justify-between gap-4">
        <h3 class="text-lg font-bold">Settings</h3>
        <button id="closeSettings" class="rounded-md bg-slate-800 px-2 py-1 text-sm text-slate-200 hover:bg-slate-700">✕</button>
      </div>
      <div class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-5 gap-3">
          <!-- <label class="block">
            <span class="text-slate-400">Reference Currency</span>
            <select id="referenceCurrency" class="mt-1 block w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="chaos">Chaos Orb</option>
              <option value="exalted" selected>Exalted Orb</option>
            </select>
          </label> -->
          <label class="block">
            <span class="text-slate-400">League</span>
            <select id="league" class="mt-1 block w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="Standard">Standard</option>
              <option value="Fate of the Vaal">Fate of the Vaal</option>
            </select>
          </label>
          <label class="block">
            <span class="text-slate-400">POESESSID</span>
            <input id="poeSessId" type="password" placeholder="Enter your POESESSID" class="mt-1 block w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </label>
        </div>
        <div class="mt-2 flex flex-wrap items-center gap-3">
          <button id="refreshPrices" class="rounded-lg bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-500">Refresh Currency Prices</button>
          <button id="recalcProfits" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">Recalculate Profits</button>
          <button id="refreshTrades" class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-500">Refresh Trade Listings</button>
          <button id="clearTradeCache" class="rounded-lg bg-rose-600 px-4 py-2 text-sm font-semibold text-white hover:bg-rose-500">Clear Trade Cache</button>
          <span id="refreshStatus" class="text-sm text-slate-300"></span>
        </div>
      </div>
      <div class="mt-5 flex justify-end gap-2">
        <button id="saveSettings" class="rounded-lg bg-violet-600 px-3 py-2 text-sm font-semibold text-white hover:bg-violet-500">Save Settings</button>
      </div>
    </div>
  </div>

  <script type="module" src="../../dist/dashboard/dashboard.js"></script>
</body>
</html>
